name: Code Quality

on:
    push:
        branches-ignore:
          - "dependabot/**"
        paths-ignore:
            - README.md
    pull_request:
        branches: [ 0.x ]
        paths-ignore:
          - "*.md"

jobs:
  tests:
    runs-on: ubuntu-20.04
    
    name: "PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Node ${{ matrix.node }}"
    
    timeout-minutes: 50
    
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
        symfony: ["^6.4"]
        node: ["20.x"]
        
    env:
      APP_ENV: test_cached
       
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: intl, mbstring
          tools: symfony
          coverage: none

      - name: Restrict Symfony version
        if: matrix.symfony != ''
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins "symfony/flex:^2.4"
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      - name: Output PHP version for Symfony CLI
        run: php -v | head -n 1 | awk '{ print $2 }' > .php-version

      - name: Restrict Symfony version
        if: matrix.symfony != ''
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json **/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Install JS dependencies
        run: npm install

      - name: Validate composer.json
        run: |
          composer validate --ansi --strict --no-check-publish

      - name: Run security check
        run: symfony security:check

      - name: Check coding standard
        run: vendor/bin/ecs check src

      - name: Check assets
        run: npm run lint

      - name: Build assets
        run: npm run build

      - name: Check twig
        run: vendor/bin/twigcs templates/ --severity error --display blocking --reporter githubAction

      - name: Run PHPSpec
        run: vendor/bin/phpspec run --ansi -f progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=7 -c phpstan.neon src/
