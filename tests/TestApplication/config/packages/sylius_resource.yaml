sylius_resource:
    mapping:
        paths:
            - '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
    resources:
        tests_adeliom_sylius_easy_crud_plugin.tests_adeliom_sylius_easy_crud_plugin_entity_post:
            driver: doctrine/orm
            classes:
                model: Tests\Adeliom\SyliusEasyCrudPlugin\Entity\Post
                repository: Tests\Adeliom\SyliusEasyCrudPlugin\Repository\PostRepository
                controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController
                form: Tests\Adeliom\SyliusEasyCrudPlugin\Admin\PostAdmin
            translation:
                classes:
                    model: Tests\Adeliom\SyliusEasyCrudPlugin\Entity\PostTranslation
                    controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController
                    form: Tests\Adeliom\SyliusEasyCrudPlugin\Admin\PostAdmin
