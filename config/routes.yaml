# Backward compatible entry point: imports the admin routes of the plugin
# under the Sylius admin path (`/admin` by default, see the
# SYLIUS_ADMIN_ROUTING_PATH_NAME environment variable).
# To choose the prefix or the host yourself, import
# `@SyliusEasyCrudPlugin/config/routes/admin.yaml` instead.
sylius_easy_crud_admin:
    resource: "@SyliusEasyCrudPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

# Routes of the resources declared with #[AsAdmin] (empty collection when
# sylius_easy_crud.attributes.enabled is false), under the Sylius admin path too.
# When you import `config/routes/admin.yaml` directly, import this loader the same
# way, with your own `prefix` / `host`:
#
#     sylius_easy_crud_attributes:
#         resource: 'Adeliom\SyliusEasyCrudPlugin\Routing\EasyCrudAttributesRoutesLoader'
#         type: service
#         host: '%admin_host%'
sylius_easy_crud_attributes:
    resource: 'Adeliom\SyliusEasyCrudPlugin\Routing\EasyCrudAttributesRoutesLoader'
    type: service
    prefix: '/%sylius_admin.path_name%'
