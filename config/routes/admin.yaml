# Admin routes of the plugin, without any path prefix.
#
# `config/routes.yaml` imports this file under the Sylius admin path
# (`/%sylius_admin.path_name%`). Import this file directly when your admin is
# served from another prefix or from its own host, e.g.:
#
#     sylius_easy_crud_admin:
#         resource: "@SyliusEasyCrudPlugin/config/routes/admin.yaml"
#         host: '%admin_host%'

sylius_easy_crud.get_oembed:
    controller: Adeliom\SyliusEasyCrudPlugin\Controller\OembedController::index
    path: /oembed/

sylius_admin_ajax_resources:
    controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController::autocompleteAction
    path: /autocomplete/

# Drag and drop of the PositionSortableField column, `{resource}` being the Sylius alias of the resource
sylius_easy_crud_admin_position_sort:
    controller: Adeliom\SyliusEasyCrudPlugin\Controller\PositionSortController::flat
    path: /position-sort/{resource}
    methods: [POST]

sylius_easy_crud_admin_position_sort_tree:
    controller: Adeliom\SyliusEasyCrudPlugin\Controller\PositionSortController::tree
    path: /position-sort/{resource}/tree
    methods: [POST]
