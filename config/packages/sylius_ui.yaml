sylius_twig_hooks:
  hooks:
    'easy_crud.common.create.content.form.sections':
      general:
        enabled: false
    'easy_crud.common.update.content.form.sections':
      general:
        enabled: false
    'sylius_admin.common.update.content.header.title_block.actions':
      easy_crud_actions:
        template: "@SyliusEasyCrudPlugin/crud/action/_actions.html.twig"
        priority: 250
    'easy_crud.common.show.content.header.title_block':
      easy_crud_actions:
        template: "@SyliusEasyCrudPlugin/crud/action/_actions.html.twig"
        priority: 0
    'easy_crud.common.show.content':
      content:
        template: '@SyliusEasyCrudPlugin/crud/show/content.html.twig'
        priority: 50
    'easy_crud.common.show.content.page_body':
      content:
        template: '@SyliusEasyCrudPlugin/crud/show/page_body.html.twig'
        priority: 50
    'easy_crud.common.create.content':
      form:
        template: '@SyliusEasyCrudPlugin/shared/crud/common/content/form.html.twig'
        priority: 50
    'easy_crud.common.update.content':
      form:
        template: '@SyliusEasyCrudPlugin/shared/crud/common/content/form.html.twig'
        priority: 50
