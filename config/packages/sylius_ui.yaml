sylius_twig_hooks:
  hooks:
    'sylius_admin.common.create.content.form.sections.general':
      default:
        template: '@SyliusEasyCrudPlugin/shared/crud/common/content/form/sections/general/default.html.twig'
        priority: 0
    'sylius_admin.common.update.content.form.sections.general':
      default:
        template: '@SyliusEasyCrudPlugin/shared/crud/common/content/form/sections/general/default.html.twig'
        priority: 0
    'sylius_admin.common.update.content.header.title_block.actions':
      easy_crud_actions:
        template: "@SyliusEasyCrudPlugin/crud/action/_actions.html.twig"
        priority: 250
    'easy_crud.common.show.content.header.title_block.actions':
      easy_crud_actions:
        template: "@SyliusEasyCrudPlugin/crud/action/_actions.html.twig"
        priority: 250
    'easy_crud.common.show.content':
      content:
        template: '@SyliusEasyCrudPlugin/crud/show/content.html.twig'
        priority: 50
    'easy_crud.common.show.content.page_body':
      content:
        template: '@SyliusEasyCrudPlugin/crud/show/page_body.html.twig'
        priority: 50
